image:
  repository: 10.34.1.1:30095/taphome-exporter
  tag: ""  # empty means the chart's appVersion

taphome:
  url: ""  # required, e.g. http://<core>/api/TapHomeApi/v1
  tokenSecret:
    name: ""  # required, an existing Secret; the chart never creates one
    key: api-token
  interval: 30

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 96Mi

# The chart installs no CRDs; these need prometheus-operator and the Grafana sidecar in the cluster.
serviceMonitor:
  enabled: false
  interval: 30s

prometheusRule:
  enabled: false

# Defaults are a guess; tune per room after a week of data.
alerts:
  contactOpenFor: 30m
  roomTempMin: 17
  roomTempMax: 28
  humidityMax: 0.7  # a fraction, as the exporter exports it

dashboard:
  enabled: false
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Home
